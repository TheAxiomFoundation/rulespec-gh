  - name: energy_sector_shortfall_and_debt_repayment_levy
    kind: derived
    entity: Payment
    dtype: Money
    unit: GHp
    source: Schedule, Energy Sector Shortfall and Debt Repayment Levy
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: gh/statute/act-1135/energy-sector-levies-2025/schedule-types-of-levies
              excerpt: "GHp 95 per litre on petrol, GHp 93 per litre on diesel"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: gh/statute/act-1135/energy-sector-levies-2025/schedule-types-of-levies
              excerpt: "GHp 95 per litre on naphtha"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: gh/statute/act-1135/energy-sector-levies-2025/schedule-types-of-levies
              excerpt: "GHp 4 per litre on fuel oil"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: gh/statute/act-1135/energy-sector-levies-2025/schedule-types-of-levies
              excerpt: "GHp 3 per litre on marine gas oil"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: gh/statute/act-1135/energy-sector-levies-2025/schedule-types-of-levies
              excerpt: "GHp 73 per kilogramme on liquefied petroleum gas"
    versions:
      - effective_from: '2025-04-02'
        formula: |-
          (shortfall_debt_petrol_rate_per_litre * petrol_litres)
          + (shortfall_debt_diesel_rate_per_litre * diesel_litres)
          + (shortfall_debt_naphtha_rate_per_litre * naphtha_litres)
          + (shortfall_debt_fuel_oil_rate_per_litre * fuel_oil_litres)
          + (shortfall_debt_marine_gas_oil_rate_per_litre * marine_gas_oil_litres)
          + (shortfall_debt_liquefied_petroleum_gas_rate_per_kilogramme * liquefied_petroleum_gas_kilogrammes)

