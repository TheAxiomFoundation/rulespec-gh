format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: gh/statute/act-1135/energy-sector-levies-2025/schedule-types-of-levies
    source_sha256: 05be38f8abdbcdfdaa54a404770ecffd2d32676bb286d6a519f55584b9beac73
  summary: |-
    Energy Sector Shortfall and Debt Repayment Levy: GHp 95 per litre on petrol, GHp 93 per litre on diesel, GHp 95 per litre on naphtha, GHp 4 per litre on fuel oil, GHp 3 per litre on marine gas oil, and GHp 73 per kilogramme on liquefied petroleum gas. Road Fund Levy: GHp 48 per litre on petrol, diesel and naphtha. Energy Fund Levy: GHp 1 per litre on petrol, diesel, fuel oil and naphtha and GHp 1 per kilogramme on kerosene. Public Lighting Levy: three per cent. National Electrification Scheme Levy: two per cent.
