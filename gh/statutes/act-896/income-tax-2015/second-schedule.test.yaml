    gh:statutes/act-896/income-tax-2015/second-schedule#input.years_since_disapplication_election: 0
  output:
    gh:statutes/act-896/income-tax-2015/second-schedule#presumptive_tax_exclusion_applies: not_holds
    gh:statutes/act-896/income-tax-2015/second-schedule#presumptive_taxation_applies: holds
    gh:statutes/act-896/income-tax-2015/second-schedule#instalment_basis_applies: holds
