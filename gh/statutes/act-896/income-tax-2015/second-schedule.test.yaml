    : false
    gh:statutes/act-896/income-tax-2015/second-schedule#input.individual_has_more_than_one_business: false
    gh:statutes/act-896/income-tax-2015/second-schedule#input.individual_has_business_with_more_than_one_outlet: false
    gh:statutes/act-896/income-tax-2015/second-schedule#input.individual_is_in_partnership: false
