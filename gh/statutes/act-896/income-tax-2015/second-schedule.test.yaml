- name: qualifying low-turnover individual uses instalment basis
  period:
    period_kind: tax_year
    start: '2016-01-01'
    end: '2016-12-31'
  input:
    gh:statutes/act-896/income-tax-2015/second-schedule#input.individual_is_resident: true
    gh:statutes/act-896/income-tax-2015/second-schedule#input.chargeable_income_consists_exclusively_of_business_income: true
    gh:statutes/act-896/income-tax-2015/second-schedule#input.business_income_is_exclusively_from_sources_in_ghana: true
    gh:statutes/act-896/income-tax-2015/second-schedule#input.individual_is_registered_for_value_added_tax: false
    gh:statutes/act-896/income-tax-2015/second-schedule#input.turnover_average_year_count: 3
