    period_kind: tax_year
    start: '2016-01-01'
    end: '2016-12-31'
  input:
    ? gh:statutes/act-896/income-tax-2015/second-schedule#input.assessable_income_from_all_businesses_is_exclusively_from_sources_in_ghana
