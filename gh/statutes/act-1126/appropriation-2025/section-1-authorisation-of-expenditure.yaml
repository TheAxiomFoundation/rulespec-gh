format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: gh/statute/act-1126/appropriation-2025/section-1-authorisation-of-expenditure
    source_sha256: 902c267554a15d2e54a981d75e5987e6584ea4026e48483550aff96616940572
  summary: |-
    “money not exceeding Two Hundred and Ninety-Three Billion, One Hundred and Eighteen Million, Twenty-Six Thousand, One Hundred and Thirty-Seven Ghana Cedis (GH¢ 293,118,026,137) shall be issued from the Consolidated Fund and other public funds during the financial year commencing on the 1st day of January, 2025 and ending on the 31st day of December, 2025 and shall be appropriated for the purposes specified in the First Schedule”
