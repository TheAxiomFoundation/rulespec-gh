  - name: proposed_expenditure_is_authorised
    kind: derived
    entity: GhanaFinancialYear
    dtype: Judgment
    period: Year
    source: Act 1126, s. 1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: gh/statute/act-1126/appropriation-2025/section-1-authorisation-of-expenditure
              excerpt: "money not exceeding ... GH¢ 293,118,026,137 shall be issued"
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: gh/statute/act-1126/appropriation-2025/section-1-authorisation-of-expenditure
              excerpt: "GH¢ 293,118,026,137"
    versions:
      - effective_from: '2025-01-01'
        formula: |-
          proposed_expenditure >= 0
          and proposed_expenditure <= total_appropriation_limit
