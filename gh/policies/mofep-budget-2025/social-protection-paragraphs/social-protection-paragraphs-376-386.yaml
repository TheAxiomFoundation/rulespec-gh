format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: gh/policy/mofep-budget-2025/social-protection-paragraphs/social-protection-paragraphs-376-386
  summary: |-
    “The allocation for 2025 reflects an increase in the feeding cost per meal per child per day from GH¢1.50 to GH¢2.00.” “Under the LEAP programme, benefits will be indexed to inflation and the number of beneficiary households will be increased from 350,000 to 400,000 from July 2025.”
  deferred_outputs:
    - output: gh:policies/mofep-budget-2025/social-protection-paragraphs/social-protection-paragraphs-376-386#budget_change_statistics
      reason: Paragraphs 376-386 announce the allocations and their year-on-year changes as budget statistics. The increase rates are rounded descriptors of the stated prior/current allocation pairs (applying the stated 33% to GH₵1,344,000,000 yields 1,787,520,000, not the stated GH₵1,788,000,000), and the beneficiary expansion from 350,000 to 400,000 households is a coverage statistic, so no benefit-unit computation in this document consumes these values; they are recorded for downstream budget-tracking outputs.
      source_values:
        - gh:policies/mofep-budget-2025/social-protection-paragraphs/social-protection-paragraphs-376-386#school_feeding_budget_allocation
        - gh:policies/mofep-budget-2025/social-protection-paragraphs/social-protection-paragraphs-376-386#school_feeding_prior_budget_allocation
        - gh:policies/mofep-budget-2025/social-protection-paragraphs/social-protection-paragraphs-376-386#school_feeding_budget_increase_rate
        - gh:policies/mofep-budget-2025/social-protection-paragraphs/social-protection-paragraphs-376-386#capitation_grant_budget_increase_rate
        - gh:policies/mofep-budget-2025/social-protection-paragraphs/social-protection-paragraphs-376-386#leap_beneficiary_households
        - gh:policies/mofep-budget-2025/social-protection-paragraphs/social-protection-paragraphs-376-386#leap_benefits_budget_allocation
        - gh:policies/mofep-budget-2025/social-protection-paragraphs/social-protection-paragraphs-376-386#leap_benefits_budget_increase_rate
